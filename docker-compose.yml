version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mern_mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - mern_network

  server:
    build:
      context: ./server
    container_name: mern_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/CollegeEventSphere}
      - PORT=5000
    depends_on:
      - mongo
    networks:
      - mern_network

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api
    container_name: mern_client
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - server
    networks:
      - mern_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mern_ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http client:80
    depends_on:
      - client
    networks:
      - mern_network

volumes:
  mongo-data:

networks:
  mern_network:
    driver: bridge
